<app-tooltip />
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="kicker">Transformaci&oacute;n Digital</div>
      <div class="title">Consumo Azure &middot; ChatMigo</div>
      <div class="sub">Tablero de recursos por ambiente y modelos</div>
    </div>
    <button class="menu-btn" (click)="toggleMenu()" aria-label="Men&uacute;">&#9776;</button>
    <nav class="nav" [class.open]="menuOpen()">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path"
           routerLinkActive="active"
           (click)="closeMenu()">
          <span class="dot" [style.background]="item.color"></span>
          {{ item.label }}
        </a>
      }
    </nav>
    <div class="foot">
      Fuente: <b>CostosGeneralChatMigo</b><br>
      Datos hasta <b>{{ footPeriod() }}</b><br>
      Moneda: <b>USD</b>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <h1>{{ viewTitle() }}</h1>
        <div class="desc">{{ viewDesc() }}</div>
      </div>
      <div [class]="hasPartial() ? 'badge-partial' : 'badge-neutral'">
        <span class="pt"></span>
        <span>{{ badgeText() }}</span>
      </div>
    </div>
    <div class="content">
      <router-outlet />
    </div>
  </div>
</div>
